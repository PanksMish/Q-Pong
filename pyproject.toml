[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qpong"
version = "1.0.0"
description = "Q-PONG: hybrid quantum-physics-informed framework for adaptive unit commitment and risk-aware smart-grid operation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Pankaj Mishra" }, { name = "Shun Okuhara" }, { name = "Tanisha Saha" },
  { name = "Sanskar Parab" }, { name = "Yashbeer Singh" },
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "networkx>=3.0",
  "matplotlib>=3.7",
  "PYPOWER>=5.1.16",
  "torch>=2.1",
  "qiskit>=1.0",
  "qiskit-aer>=0.14",
]

[project.optional-dependencies]
hardware = ["qiskit-ibm-runtime>=0.40"]
data = ["pvlib>=0.10"]
gurobi = ["gurobipy>=11.0"]
dev = ["pytest>=7", "ruff>=0.4"]
all = ["qiskit-ibm-runtime>=0.40", "pvlib>=0.10", "pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["qpong*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
